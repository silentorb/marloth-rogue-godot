syntax = "proto3";

package marloth.automation;

service AutomationService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ListPlaybooks(ListPlaybooksRequest) returns (ListPlaybooksResponse);
  rpc RunPlaybook(RunPlaybookRequest) returns (PlaybookResultResponse);
  rpc Shutdown(ShutdownRequest) returns (CommandResponse);
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  string message = 2;
}

message ListPlaybooksRequest {}

message ListPlaybooksResponse {
  bool ok = 1;
  string error = 2;
  repeated string playbook_ids = 3;
}

message RunPlaybookRequest {
  string playbook_id = 1;
  string args_json = 2;
}

message PlaybookResultResponse {
  bool ok = 1;
  string error = 2;
  string diagnostics = 3;
}

message ShutdownRequest {}

message CommandResponse {
  bool ok = 1;
  string error = 2;
}
